<!DOCTYPE html>
<html>
<head>
<title>MyOpinionLab - Earn Rewards</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js"></script>
<style>
body{font-family:system-ui;background:#f8fafc;margin:0;padding:0}
.header{background:white;padding:15px;text-align:center;box-shadow:0 1px 3px #ddd}
.card{background:white;max-width:420px;margin:40px auto;padding:25px;border-radius:16px;box-shadow:0 4px 20px #0001;text-align:center}
input{width:100%;padding:14px;margin:8px 0;border:1px solid #e2e8f0;border-radius:10px;box-sizing:border-box}
button{background:#4f46e5;color:white;padding:14px;width:100%;border:none;border-radius:10px;font-weight:bold;cursor:pointer;margin-top:10px}
.honeypot{display:none !important}
.small{color:#64748b;font-size:13px;margin-top:15px}
</style>
</head>
<body>
<div class="header"><b>MyOpinionLab</b> - Survey Rewards</div>
<div class="card">
<h2>Join & Earn</h2>
<p style="color:#64748b">Get paid for your opinion</p>
<form id="f">
<input id="name" placeholder="Full Name" required>
<input id="email" type="email" placeholder="Email Address" required>
<!-- Honeypot trap for bots -->
<input id="website" class="honeypot" tabindex="-1" autocomplete="off">
<div class="cf-turnstile" data-sitekey="1x00000000000000000000AA"></div>
<button type="submit">Create Free Account</button>
<p id="s" class="small"></p>
</form>
<p class="small">🔒 Protected by Anti-Bot System (5 Layers)</p>
</div>
<script>
let mouseMoved=false, startTime=Date.now();
document.addEventListener('mousemove',()=>mouseMoved=true);
document.addEventListener('touchstart',()=>mouseMoved=true);
document.getElementById('f').addEventListener('submit',function(e){
 e.preventDefault();
 if(document.getElementById('website').value!==""){alert("BOT DETECTED: Honeypot");return}
 if(!e.isTrusted){alert("BOT DETECTED: Fake click");return}
 if(navigator.webdriver){alert("BOT DETECTED: Automation");return}
 let t=Date.now()-startTime; if(t<2500){alert("BOT DETECTED: Too fast ("+t+"ms) - human no fit type that fast");return}
 if(!mouseMoved){alert("BOT DETECTED: No human movement");return}
 document.getElementById('s').innerText="✅ Human verified! Welcome to MyOpinionLab (demo - we go connect database next)";
});
</script>
</body>
</html>
